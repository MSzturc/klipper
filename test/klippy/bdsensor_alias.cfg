# Test config for BDSensor when SDA/SCL/endstop pins are referenced via
# [board_pins] aliases instead of their hardware pin names. Mirrors the
# BTT-Kraken pattern (stm32h723xx) where probe wiring is named for what
# the board exposes (PROBE_SENSOR / PROBE_CONTROL) rather than the MCU
# pin. _resolve_pin_alias() in klippy/extras/BDsensor.py must unwrap
# these aliases before forwarding the pin name to the MCU; without it,
# the literal alias string would be sent and the MCU would reject it.

[board_pins kraken]
aliases:
    PROBE_SENSOR=PG1, PROBE_CONTROL=PE9, PROBE_INTERRUPT=PG2,
    HOTEND_HEATER=PB0, HOTEND_SENSOR=PA1, HOTEND_FAN=PA2,
    BED_HEATER=PB1, BED_SENSOR=PA0,
    X_STEP=PE2, X_DIR=PE1, X_ENABLE=PE0, X_ENDSTOP=PC4,
    Y_STEP=PE5, Y_DIR=PE4, Y_ENABLE=PE3, Y_ENDSTOP=PC5,
    Z_STEP=PD7, Z_DIR=PD6, Z_ENABLE=PD5,
    E_STEP=PB7, E_DIR=PB8, E_ENABLE=PB6

[stepper_x]
step_pin: X_STEP
dir_pin: X_DIR
enable_pin: !X_ENABLE
microsteps: 16
rotation_distance: 40
endstop_pin: ^X_ENDSTOP
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: Y_STEP
dir_pin: !Y_DIR
enable_pin: !Y_ENABLE
microsteps: 16
rotation_distance: 40
endstop_pin: ^Y_ENDSTOP
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: Z_STEP
dir_pin: Z_DIR
enable_pin: !Z_ENABLE
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 200

[extruder]
step_pin: E_STEP
dir_pin: E_DIR
enable_pin: !E_ENABLE
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: HOTEND_HEATER
sensor_type: EPCOS 100K B57560G104F
sensor_pin: HOTEND_SENSOR
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: BED_HEATER
sensor_type: EPCOS 100K B57560G104F
sensor_pin: BED_SENSOR
control: watermark
min_temp: 0
max_temp: 130

# BDSensor configured with aliases at all three pin-resolution sites
# (sda, scl, and the optional endstop). The driver must resolve
# PROBE_SENSOR -> PG1, PROBE_CONTROL -> PE9, and PROBE_INTERRUPT -> PG2
# before sending pin names to the MCU.
[BDsensor]
sda_pin: PROBE_SENSOR
scl_pin: PROBE_CONTROL
endstop_pin: ^PROBE_INTERRUPT
delay: 10
x_offset: 0
y_offset: 0
z_offset: 0
no_stop_probe: true
position_endstop: 0.6
collision_homing: 0
collision_calibrate: 0
speed: 15

[bed_mesh]
mesh_min: 10,10
mesh_max: 180,180

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
