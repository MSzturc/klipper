# Config for MPC heater testing
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[fan_generic part_cooling_fan]
pin: PH3

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PF4
min_temp: 0
max_temp: 60

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
min_temp: 0
max_temp: 260

control: mpc
heater_power: 50.0
block_heat_capacity: 22.4
sensor_responsiveness: 0.733
ambient_transfer: 0.068
fan_ambient_transfer: 0.05, 0.06, 0.075
cooling_fan: fan_generic part_cooling_fan
ambient_temp_sensor: temperature_sensor chamber
filament_diameter: 1.75
filament_density: 1.2
filament_heat_capacity: 1.8
filament_temperature_source: ambient

[heater_bed]
heater_pin: PB5
sensor_type: Generic 3950
sensor_pin: PK6
min_temp: 0
max_temp: 120
control: mpc
heater_power: 250.0
block_heat_capacity: 600.0
sensor_responsiveness: 0.0146
ambient_transfer: 5.0

[temperature_sensor extruder_block]
sensor_type: mpc_block_temperature
heater_name: extruder
min_temp: 0
max_temp: 325
ignore_limits: True

[temperature_sensor extruder_ambient]
sensor_type: mpc_ambient_temperature
heater_name: extruder
min_temp: 0
max_temp: 325
ignore_limits: True

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
